[package]
name = "riftstone"
description = "The Riftstone — a Dragon's Dogma 2 mod manager that can see inside every archive."
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "riftstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rift-core.workspace = true
rift-archive.workspace = true
rift-pak.workspace = true
rift-catalog.workspace = true
rift-deploy.workspace = true
rift-nexus.workspace = true

tauri = { version = "2", features = [] }
# The first plugin (v0.3): a second launch — Windows starting
# `riftstone.exe "nxm://…"` for the site's Mod Manager Download button —
# hands its arguments to the running stone and exits. No `deep-link`
# feature: the stone never declares a URL scheme of its own (the nxm handler
# is the player's opt-in, written Rust-side).
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"

serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
base64.workspace = true
image.workspace = true
notify.workspace = true
chrono.workspace = true
# The optional Nexus API key lives in the OS credential store (Windows
# Credential Manager on the investor's machine; the Secret Service on the
# Linux bench) — never in a file, never in the webview (RS-6).
keyring.workspace = true

# The nxm handler (v0.3) reads HKCR and writes HKCU\Software\Classes\nxm,
# only when the player turns it on. Windows-only: the Linux bench never
# compiles it (`protocol::system_registry` hands it an unsupported registry
# instead).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# A download lands without ever writing over a file. Where hard links fail
# (FAT32, exFAT, some network shares) it moves with MoveFileExW and no
# MOVEFILE_REPLACE_EXISTING (the version rift-deploy already uses).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The same move on the Linux bench: renameat2 with RENAME_NOREPLACE.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Tauri's mock runtime: the IPC test invokes every command the way the window
# does (exact invoke names, camelCase argument keys) with no window at all.
tauri = { version = "2", features = ["test"] }
# The command-layer test builds its library collection as a real zip at run time.
zip.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
