# The Riftstone — workspace root.
#
# Nine small crates and the Tauri spine. The pure crates (everything under
# crates/) compile and test without a webview, so `cargo test --workspace
# --exclude riftstone` runs in seconds on any bench; only src-tauri pulls in
# Tauri. Every crate depends on rift-core for the shared domain contract.
#
#   rift-core     the contract: packages, options, payload, deploy targets, errors
#   rift-archive  reads a package: zip / 7z / rar / plain folder
#   rift-pak      reads an RE Engine .pak table of contents; murmur3 path hashes
#   rift-catalog  modinfo.ini, option discovery, the addon tree, search, conflicts
#   rift-deploy   the game install, preflight, Play's plan, the journal, install/uninstall
#   rift-nexus    Nexus Mods: links, md5 lookup, update checks, browse; with a key the
#                 account, downloads, tracking and endorsing; nxm links
#   rift-save     a Dragon's Dogma 2 save: the container, its cipher, the class stream
#   rift-muster   the party in a save, named from the game's own text
#   rift-fray     THE FRAY: the eye's fight log, credited per member and cut into fights
#   src-tauri     the window's spine: state, commands, events, downloads, Play

[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.7.1"
edition = "2021"
authors = ["Gerard Oosterhof <gerard@script.nl>"]
rust-version = "1.85"

[workspace.dependencies]
rift-core = { path = "crates/rift-core" }
rift-archive = { path = "crates/rift-archive" }
rift-pak = { path = "crates/rift-pak" }
rift-catalog = { path = "crates/rift-catalog" }
rift-deploy = { path = "crates/rift-deploy" }
rift-nexus = { path = "crates/rift-nexus" }
rift-save = { path = "crates/rift-save" }
rift-muster = { path = "crates/rift-muster" }
rift-fray = { path = "crates/rift-fray" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
encoding_rs = "0.8"
base64 = "0.23"
md-5 = "0.11"
sha2 = "0.11"
walkdir = "2"
rayon = "1"

# Archive formats. zip: pure Rust, deflate + deflate64 + bzip2 + zstd + lzma
# cover what Nexus uploads use. sevenz-rust2: pure Rust 7z with the BZip2 and
# PPMd coders too (AES stays off: an encrypted 7z is reported, never opened).
# unrar_sys: the official UnRAR C++ source compiled by cc — RAR5 is common on
# Nexus (the investor's own library holds a RAR5 archive). rift-archive calls
# it through its own packed mirrors of dll.hpp (src/unrar_dll.rs), because the
# `unrar` crate's safe wrapper cannot cancel a read mid-entry.
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "time"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util", "bzip2", "ppmd"] }
unrar_sys = "0.5.8"
crc32fast = "1.5"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
keyring = "4"
notify = "8"

# The Muster (v0.4): the save's cipher and inflate, and the game pak's
# compression. aes and num-bigint are pure Rust (RustCrypto, num); zstd is
# already compiled for zip's sake.
aes = "0.9"
num-bigint = "0.4"
flate2 = "1"
zstd = "0.14"

tempfile = "3"
filetime = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
