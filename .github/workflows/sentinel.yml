# ============================================================================
# THE SENTINEL — the Riftstone's containment protocols (repo-local)
# ============================================================================
# Runs on every push to main and every pull request against main. The gadget
# gates its own pull requests: a parent-side path filter on a gitlink bump
# never matches, so the gate must live here.
#
# Three jobs:
#   * window  — Vue/TS: typecheck, lint, test, format, build
#   * crates  — Rust: fmt, clippy (warnings denied), test, the whole workspace
#   * privacy — the privacy sweep's own checks on invented data
#
# CI never sees the player's library, journal, saves or game: every [GATE] test
# builds its fixtures at run time from invented data, and the env-gated benches
# stay #[ignore]d. The full privacy sweep reads the real library, so it runs on
# the bench before every push, never here.
#
# Rust is pinned to 1.98.0, the toolchain both benches (Linux and the native
# Windows MSVC runs) verified the workspace with: a newer stable can add a
# clippy lint that `-D warnings` turns red overnight. Moving the pin is a
# deliberate commit, run on both benches first.
# ============================================================================

name: Sentinel — The Riftstone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  window:
    name: Window — Typecheck + Lint + Test + Format + Build
    runs-on: ubuntu-latest
    # A Sentinel job that runs long is broken, not busy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (the window's specs, the stands-alone spec included)
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  crates:
    name: Crates — Fmt + Clippy + Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux libraries Tauri and the key store link against
        # Retries let a flaky mirror heal itself, and the ceiling turns a hung
        # one into a fast red (the Smuggler's Ledger once waited six hours on a
        # bare apt-get). libdbus: the key store reaches the Secret Service over
        # D-Bus on Linux.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Tauri's codegen needs the frontendDist folder to exist.
      - name: Provide an empty window build
        run: mkdir -p dist

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (every [GATE] criterion, fixtures built at run time)
        run: cargo test --workspace

  privacy:
    name: Privacy — The Sweep's Own Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: The privacy sweep's self-test (invented data; reads no library)
        run: python3 -I scripts/privacy-sweep.py --self-test
