# ============================================================================
# THE SENTINEL — the Riftstone's containment protocols (repo-local)
# ============================================================================
# Runs on every push to main and every pull request against main. The gadget
# gates its own pull requests: a parent-side path filter on a gitlink bump
# never matches, so the gate must live here.
#
# Three jobs:
#   * window  — Vue/TS: typecheck, lint, test, format, build
#   * crates  — Rust: fmt, clippy (warnings denied), test, the whole workspace
#   * privacy — the privacy sweep's own checks on invented data
#
# CI never sees the player's library, journal, saves or game: every [GATE] test
# builds its fixtures at run time from invented data, and the env-gated benches
# stay #[ignore]d. The full privacy sweep reads the real library, so it runs on
# the bench before every push, never here.
#
# Rust is pinned to 1.98.0, the toolchain both benches (Linux and the native
# Windows MSVC runs) verified the workspace with: a newer stable can add a
# clippy lint that `-D warnings` turns red overnight. Moving the pin is a
# deliberate commit, run on both benches first.
# ============================================================================

name: Sentinel — The Riftstone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  window:
    name: Window — Typecheck + Lint + Test + Format + Build
    runs-on: ubuntu-latest
    # A Sentinel job that runs long is broken, not busy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (the window's specs, the stands-alone spec included)
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  crates:
    name: Crates — Fmt + Clippy + Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux libraries Tauri and the key store link against
        # Retries let a flaky mirror heal itself, and the ceiling turns a hung
        # one into a fast red (the Smuggler's Ledger once waited six hours on a
        # bare apt-get). libdbus: the key store reaches the Secret Service over
        # D-Bus on Linux.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Tauri's codegen needs the frontendDist folder to exist.
      - name: Provide an empty window build
        run: mkdir -p dist

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # RS-8: the only save sealer is the fixtures features' test code, so the graph the
      # shipped exe is built from must switch none of them on (dev edges are tests only).
      # The graph is its own denominator: the assignment fails the step under `-e` when
      # `cargo tree` fails, and a graph without the exe fails it before the check can pass
      # on nothing (the General's review of PR #1).
      - name: RS-8 (the shipped graph switches on no fixtures feature)
        run: |
          tree=$(cargo tree -p riftstone -e normal,build --prefix none -f '{p} {f}')
          grep -q '^riftstone ' <<<"$tree" || { echo "::error::cargo tree listed no riftstone"; exit 1; }
          if grep -E '^rift-[a-z]+ .*fixtures' <<<"$tree"; then
            echo "::error::a fixtures feature reaches the graph riftstone.exe is built from (RS-8)"
            exit 1
          fi

      - name: Test (every [GATE] criterion, fixtures built at run time)
        run: cargo test --workspace

      # RS-10: THE WORKSHOP (Tamsin, her fence, her tools) is compiled only with the
      # `pawn` feature, which the public build never switches on. The graph is its own
      # denominator, as RS-8's is, and the positive control proves the grep can see the
      # feature when it is on, so the check cannot pass by being wrong.
      - name: RS-10 (the public graph carries no pawn; the investor's does)
        run: |
          tree=$(cargo tree -p riftstone -e normal,build --prefix none -f '{p} {f}')
          line=$(grep '^riftstone ' <<<"$tree") || { echo "::error::cargo tree listed no riftstone"; exit 1; }
          if grep -qw pawn <<<"$line"; then
            echo "::error::the default build of riftstone switches on the pawn feature (RS-10)"
            exit 1
          fi
          pawned=$(cargo tree -p riftstone --features pawn -e normal,build --prefix none -f '{p} {f}')
          grep '^riftstone ' <<<"$pawned" | grep -qw pawn || { echo "::error::the positive control saw no pawn feature"; exit 1; }

      # The pawn's code compiles nowhere in the default build, so it is linted and
      # tested on its own, warnings denied.
      - name: Clippy with the pawn (warnings denied)
        run: cargo clippy -p riftstone --all-targets --features pawn -- -D warnings

      - name: Test with the pawn (the fence, the mailbox, the runs, bring-through)
        run: cargo test -p riftstone --features pawn

  privacy:
    name: Privacy — The Sweep's Own Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: The privacy sweep's self-test (invented data; reads no library)
        run: python3 -I scripts/privacy-sweep.py --self-test
